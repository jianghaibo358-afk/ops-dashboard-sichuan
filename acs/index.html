<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACS连带率看板 · 川渝</title>
<style>
  :root{
    --bg:#f7f8fa; --card:#ffffff; --line:#eceef1; --text:#1a1a1a; --muted:#8a8f98;
    --accent:#0a84ff; --ok:#16a34a; --warn:#d97706; --bad:#e5484d;
    --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--text);padding:14px;max-width:1560px;margin:0 auto;line-height:1.5}
  header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
  h1{font-size:18px;font-weight:700}
  .meta{font-size:12px;color:var(--muted)}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px}
  .card .k{font-size:11px;color:var(--muted);margin-bottom:2px}
  .card .v{font-size:20px;font-weight:700}
  .card .v small{font-size:12px;font-weight:400;color:var(--muted)}
  .filters{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:12px}
  .frow{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
  .fgroup{display:flex;flex-direction:column;gap:2px;min-width:110px;flex:1}
  .fgroup label{font-size:10px;color:var(--muted)}
  select,input[type=text]{padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12px;background:#fff;color:var(--text);min-width:0}
  .range{display:flex;flex-direction:column;gap:4px}
  .range .rl{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}
  .range .rv{font-size:12px;font-weight:600}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .btn{padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:12px;cursor:pointer;color:var(--text)}
  .btn:hover{background:#f0f1f3}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .tblwrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .summary{font-size:11px;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--line)}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;font-size:12px}
  thead th{background:#fafbfc;text-align:left;padding:7px 9px;font-weight:600;font-size:11px;color:var(--muted);
           border-bottom:1px solid var(--line);position:sticky;top:0;white-space:nowrap;cursor:pointer;user-select:none}
  tbody td{padding:6px 9px;border-bottom:1px solid #f3f4f6;white-space:nowrap}
  tbody tr:hover{background:#fafbfc}
  .num{text-align:right}
  .tag{display:inline-block;padding:1px 7px;border-radius:12px;font-size:10px;font-weight:600}
  .tag.ok{background:#e8f7ee;color:var(--ok)}
  .tag.warn{background:#fdf1e3;color:var(--warn)}
  .tag.bad{background:#fdeaea;color:var(--bad)}
  .bar{width:52px;height:5px;background:#eef0f2;border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle}
  .bar i{display:block;height:100%;background:var(--accent)}
  .offrow{background:#fafbfc;font-weight:600}
  .offrow td{color:#333}
  .empty{padding:32px;text-align:center;color:var(--muted)}
  @media(max-width:900px){
    body{padding:10px}
    .cards{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
    .card{padding:10px 12px}
    .card .v{font-size:18px}
    table{font-size:11px}
    thead th{padding:7px 7px;font-size:10px}
    tbody td{padding:6px 7px}
    .bar{width:48px}
  }
  @media(max-width:600px){ h1{font-size:18px} .card .v{font-size:16px} table{font-size:10.5px} }
</style>
</head>
<body>
  <header>
    <h1>ACS 连带率看板 · 川渝</h1>
    <div class="meta" id="meta">数据加载中…</div>
    <button class="btn primary" id="btnExport">导出 CSV</button>
  </header>

  <div class="cards" id="cards"></div>

  <div class="filters">
    <div class="frow">
      <div class="fgroup">
        <label>办事处</label>
        <select id="fOff"><option value="">全部</option></select>
      </div>
      <div class="fgroup">
        <label>门店类型</label>
        <select id="fType"><option value="">全部</option></select>
      </div>
      <div class="fgroup">
        <label>负责人</label>
        <select id="fRep"><option value="">全部</option></select>
      </div>
      <div class="fgroup">
        <label>门店搜索</label>
        <input type="text" id="fName" placeholder="输入门店名…">
      </div>
      <div class="fgroup range">
        <div class="rl"><span>ACS连带率区间</span><span class="rv" id="rateLabel">0% – 100%</span></div>
        <input type="range" id="fRateMin" min="0" max="100" value="0" step="1">
        <input type="range" id="fRateMax" min="0" max="100" value="100" step="1">
      </div>
      <button class="btn primary" id="btnReset">重置</button>
    </div>
  </div>

  <div class="tblwrap">
    <div class="summary" id="summary"></div>
    <div class="scroll">
      <table id="tbl">
        <thead>
          <tr>
            <th>办事处</th>
            <th>门店</th>
            <th>负责人</th>
            <th class="num">iPhone</th>
            <th class="num">ACS</th>
            <th class="num">连带率</th>
            <th>距目标</th>
            <th class="num">今日iPhone</th>
            <th class="num">今日ACS</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

<script src="data.js"></script>
<script>
var D = null;
var TARGET = 0.15;
var sortKey = 'acsR', sortAsc = false;

function fmtRate(r){ return r==null||r===undefined ? '—' : (r*100).toFixed(1)+'%'; }
function fmtR(r){ return r==null||r===undefined ? '—' : r.toFixed(1)+'%'; }
function gapOf(s){ return s.ip*TARGET - s.acsN; }
function gapLabel(s){
  if(s.ip===0) return '—';
  var g = gapOf(s);
  if(g<=0) return '<span class="tag ok">达标</span>';
  return '<span class="tag '+(g>=5?'bad':'warn')+'">缺'+Math.round(g)+'台</span>';
}
function rateTag(r){
  if(r==null||r===undefined) return '—';
  var p=r*100;
  if(p>=15) return '<span class="tag ok">'+p.toFixed(1)+'%</span>';
  if(p>=10) return '<span class="tag warn">'+p.toFixed(1)+'%</span>';
  return '<span class="tag bad">'+p.toFixed(1)+'%</span>';
}
function barOf(r){
  if(r==null||r===undefined) return '';
  var w=Math.min(100, r/TARGET*100);
  var c = r>=TARGET?'var(--ok)':(r>=TARGET*0.75?'var(--warn)':'var(--bad)');
  return '<span class="bar"><i style="width:'+w+'%;background:'+c+'"></i></span>';
}

function init(){
  D = window.ACS_DATA;
  var meta = D.meta || {};
  document.getElementById('meta').textContent = (meta.asOf||'—') +' · 目标15% · 口径 ACS/iPhone(线下)';

  // 填充筛选选项
  var offs=[],types=[],reps=[];
  var oset={},tset={},rset={};
  D.stores.forEach(function(s){
    if(!oset[s.off]){oset[s.off]=1;offs.push(s.off);}
    if(!tset[s.type]){tset[s.type]=1;types.push(s.type);}
    if(!rset[s.rep]){rset[s.rep]=1;reps.push(s.rep);}
  });
  offs.sort();types.sort();reps.sort();
  fill('fOff',offs);fill('fType',types);fill('fRep',reps);

  renderCards();
  render();
  bind();
}

function fill(id,arr){
  var sel=document.getElementById(id);
  arr.forEach(function(v){
    var o=document.createElement('option');o.value=v;o.textContent=v;sel.appendChild(o);
  });
}

function renderCards(){
  var s=D.stores;
  var ip=0,acs=0; var offAgg={};
  s.forEach(function(x){
    ip+=x.ip; acs+=x.acsN;
    if(!offAgg[x.off])offAgg[x.off]={ip:0,acs:0};
    offAgg[x.off].ip+=x.ip; offAgg[x.off].acs+=x.acsN;
  });
  var rate=ip?acs/ip*100:0;
  var gap=ip*TARGET-acs;
  var html='';
  html+='<div class="card"><div class="k">iPhone 月销量</div><div class="v">'+ip.toLocaleString()+' <small>台</small></div></div>';
  html+='<div class="card"><div class="k">ACS 连带</div><div class="v">'+acs.toLocaleString()+' <small>台</small></div></div>';
  html+='<div class="card"><div class="k">连带率</div><div class="v" style="color:'+(rate>=15?'var(--ok)':'var(--bad)')+'">'+rate.toFixed(2)+'%</div></div>';
  html+='<div class="card"><div class="k">距15%目标</div><div class="v" style="color:'+(gap<=0?'var(--ok)':'var(--bad)')+'">'+(gap<=0?'超'+Math.round(-gap):'缺'+Math.round(gap))+' <small>台</small></div></div>';
  document.getElementById('cards').innerHTML=html;
}

function filtered(){
  var fOff=document.getElementById('fOff').value;
  var fType=document.getElementById('fType').value;
  var fRep=document.getElementById('fRep').value;
  var fName=document.getElementById('fName').value.trim();
  var rMin=parseInt(document.getElementById('fRateMin').value,10)/100;
  var rMax=parseInt(document.getElementById('fRateMax').value,10)/100;
  return D.stores.filter(function(s){
    if(fOff && s.off!==fOff) return false;
    if(fType && s.type!==fType) return false;
    if(fRep && s.rep!==fRep) return false;
    if(fName && s.name.indexOf(fName)<0) return false;
    if(s.acsR==null||s.acsR===undefined){ if(rMin>0) return false; }
    else { if(s.acsR<rMin||s.acsR>rMax) return false; }
    return true;
  });
}

function render(){
  var rows=filtered();
  var ip=0,acs=0,missing=0;
  rows.forEach(function(x){ip+=x.ip;acs+=x.acsN;if(gapOf(x)>0)missing++;});
  var rate=ip?acs/ip*100:0;
  document.getElementById('summary').textContent =
    '筛选结果 '+rows.length+' 家 · iPhone '+ip+' 台 · ACS '+acs+' 台 · 连带率 '+(ip?rate.toFixed(2)+'%':'—')+' · 未达标 '+missing+' 家';

  // 按办事处分组
  var groups={},order=[];
  rows.forEach(function(s){ if(!groups[s.off]){groups[s.off]=[];order.push(s.off);} groups[s.off].push(s); });
  order.sort();

  var html='';
  if(rows.length===0){ html='<tr><td colspan="9" class="empty">无匹配门店</td></tr>'; }
  order.forEach(function(off){
    var list=groups[off];
    var gip=0,gacs=0,gdip=0,gdacs=0; list.forEach(function(x){gip+=x.ip;gacs+=x.acsN;gdip+=x.ipD||0;gdacs+=x.acsD||0;});
    var grate=gip?gacs/gip*100:0;
    html+='<tr class="offrow"><td>'+off+'</td><td>小计 '+list.length+' 家</td><td></td>'+
          '<td class="num">'+gip+'</td><td class="num">'+gacs+'</td>'+
          '<td class="num" style="color:'+(grate>=15?'var(--ok)':'var(--bad)')+'">'+grate.toFixed(1)+'%</td>'+
          '<td></td>'+
          '<td class="num">'+gdip+'</td><td class="num">'+gdacs+'</td></tr>';
    // 组内排序
    list.sort(function(a,b){
      var va=sortKey in a?a[sortKey]:0, vb=sortKey in b?b[sortKey]:0;
      if(va==null)va=0; if(vb==null)vb=0;
      return sortAsc?va-vb:vb-va;
    });
    list.forEach(function(s){
      html+='<tr>'+
        '<td></td>'+
        '<td>'+esc(s.name)+'</td>'+
        '<td>'+esc(s.rep)+'</td>'+
        '<td class="num">'+s.ip+'</td>'+
        '<td class="num">'+s.acsN+'</td>'+
        '<td class="num">'+rateTag(s.acsR)+' '+barOf(s.acsR)+'</td>'+
        '<td>'+gapLabel(s)+'</td>'+
        '<td class="num">'+(s.ipD||0)+'</td>'+
        '<td class="num">'+(s.acsD||0)+'</td>'+
        '</tr>';
    });
  });
  document.getElementById('tbody').innerHTML=html;
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

function bind(){
  ['fOff','fType','fRep','fName','fRateMin','fRateMax'].forEach(function(id){
    document.getElementById(id).addEventListener('input',onFilter);
  });
  document.getElementById('btnExport').addEventListener('click',exportCSV);
  document.getElementById('btnReset').addEventListener('click',function(){
    document.getElementById('fOff').value='';
    document.getElementById('fType').value='';
    document.getElementById('fRep').value='';
    document.getElementById('fName').value='';
    document.getElementById('fRateMin').value=0;
    document.getElementById('fRateMax').value=100;
    render();
  });
  // 表头排序
  var thMap={2:'rep',3:'ip',4:'acsN',5:'acsR',7:'ipD',8:'acsD'};
  document.querySelectorAll('thead th').forEach(function(th,i){
    th.addEventListener('click',function(){
      var k=thMap[i]; if(!k)return;
      if(sortKey===k) sortAsc=!sortAsc; else {sortKey=k;sortAsc=false;}
      render();
    });
  });
}
function exportCSV(){
  var rows = filtered();
  if(rows.length===0){ alert('当前筛选无数据'); return; }
  var head = ['办事处','门店','负责人','iPhone','ACS','连带率%','缺口(台)','今日iPhone','今日ACS'];
  function q(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; }
  function rp(x){ return x==null||x===undefined?'':(x*100).toFixed(2); }
  var lines=[head.map(q).join(',')];
  // 按办事处分组导出，含小计行
  var groups={},order=[];
  rows.forEach(function(s){ if(!groups[s.off]){groups[s.off]=[];order.push(s.off);} groups[s.off].push(s); });
  order.sort();
  order.forEach(function(off){
    var list=groups[off];
    var gip=0,gacs=0,gdip=0,gdacs=0; list.forEach(function(x){gip+=x.ip;gacs+=x.acsN;gdip+=x.ipD||0;gdacs+=x.acsD||0;});
    var grate=gip?(gacs/gip*100):0;
    lines.push([q(off+' (小计 '+list.length+'家)'),'', '', gip, gacs, grate.toFixed(2), Math.round(gip*TARGET-gacs), gdip, gdacs].join(','));
    list.forEach(function(s){
      lines.push([
        q(s.off), q(s.name), q(s.rep),
        s.ip, s.acsN, rp(s.acsR), Math.round(gapOf(s)), (s.ipD||0), (s.acsD||0)
      ].join(','));
    });
  });
  var csv='\ufeff'+lines.join('\r\n');
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  var a=document.createElement('a');
  var d=(D.meta&&D.meta.asOf)||'data';
  a.href=URL.createObjectURL(blob);
  a.download='ACS连带率_'+d+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

function onFilter(){
  var mn=parseInt(document.getElementById('fRateMin').value,10);
  var mx=parseInt(document.getElementById('fRateMax').value,10);
  if(mn>mx){ document.getElementById('fRateMin').value=mx; mn=mx; }
  document.getElementById('rateLabel').textContent=mn+'% – '+mx+'%';
  render();
}

init();
</script>
</body>
</html>
