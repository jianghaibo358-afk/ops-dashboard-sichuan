<style>

  .cards{display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:14px;}

       display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
  .bar select,.bar input[type=text]{height:30px; border:1px solid var(--line); border-radius:6px; padding:0 8px;
       font-size:13px; background:#fff; color:var(--ink);}

  .btn{height:30px; padding:0 12px; border-radius:6px; border:1px solid var(--blue); background:var(--blue);
       color:#fff; font-size:13px; cursor:pointer;}
  .btn.gray{background:#fff; color:var(--ink2); border-color:var(--line);}
  .stat{color:var(--ink2); font-size:13px; margin:2px 0 8px;}
  .stat b{color:var(--ink);}
  .tbbox{background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:auto; max-height:72vh;}

  .num{text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums;}

  .tag.iphone{background:#e8f1ff; color:var(--blue); border-color:#cfe2ff;}

  .desc{color:var(--ink2);}
  .empty{padding:26px; text-align:center; color:var(--ink3);}

  .gate-err{color:var(--sev); font-size:12px; margin-top:8px; height:16px;}

  function card(lb, vl, unit){

  }

  function opts(id, key){
    var set = {}; ROWS.forEach(function(r){ if(r[key]) set[r[key]]=1; });
    var arr = Object.keys(set).sort(function(a,b){return a.localeCompare(b,"zh");});
    var el = document.getElementById(id), cur = el.value;
    arr.forEach(function(v){
      var o = document.createElement("option"); o.value=v; o.textContent=v;
      if(v===cur) o.selected=true; el.appendChild(o);
    });
  }
  function initOpts(){ opts("f-store","s"); opts("f-cat","g"); opts("f-series","m"); opts("f-lob","l"); opts("f-spec","p"); }

  function uniq(arr){ return arr.filter(function(v,i){return arr.indexOf(v)===i;}); }
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  function apply(filterSeries){
    var store=document.getElementById("f-store").value, cat=document.getElementById("f-cat").value,
        ser=document.getElementById("f-series").value, lob=document.getElementById("f-lob").value,
        spec=document.getElementById("f-spec").value, kw=document.getElementById("f-kw").value.trim().toLowerCase(),
        only=document.getElementById("f-only").checked, sort=document.getElementById("f-sort").value;

    var rs = ROWS.filter(function(r){
      if(store && r.s!==store) return false;
      if(cat && r.g!==cat) return false;
      if(ser && r.m!==ser) return false;
      if(lob && r.l!==lob) return false;
      if(spec && r.p!==spec) return false;
      if(only && r.a<=0) return false;
      if(kw){
        var hay=(r.d+" "+r.c+" "+r.s+" "+r.m).toLowerCase();
        if(hay.indexOf(kw)<0) return false;
      }
      return true;
    });

    if(sort==="a_desc") rs.sort(function(a,b){return b.a-a.a;});
    else if(sort==="a_asc") rs.sort(function(a,b){return a.a-b.a;});
    else if(sort==="s_asc") rs.sort(function(a,b){return a.s.localeCompare(b.s,"zh")||b.a-a.a;});
    else if(sort==="d_asc") rs.sort(function(a,b){return a.d.localeCompare(b.d,"zh")||b.a-a.a;});

    var ta=0, tt=0, ti=0;
    rs.forEach(function(r){ ta+=r.a; tt+=r.t; if(r.l==="iPhone") ti+=r.a; });
    document.getElementById("stat").innerHTML =
      "当前筛选 <b>"+fmt(rs.length)+"</b> 行 ｜ 可用合计 <b>"+fmt(ta)+"</b> ｜ 在途 <b>"+fmt(tt)+
      "</b> ｜ 其中 iPhone 可用 <b>"+fmt(ti)+"</b>";

    if(filterSeries){
      var pool = ROWS.filter(function(r){
        if(cat && r.g!==cat) return false;
        if(lob && r.l!==lob) return false;
        return true;
      });
      rebuild("f-series", "m", pool);
      rebuild("f-spec", "p", pool);
    }

    var tb=document.getElementById("tb");
    if(!rs.length){ tb.innerHTML=""; document.getElementById("empty").style.display="block"; return; }
    document.getElementById("empty").style.display="none";
    var html="", n=Math.min(rs.length, 1500);
    for(var i=0;i<n;i++){
      var r=rs[i];
      var cls = r.a>0 ? "" : "av0";
      var tg = r.l==="iPhone" ? '<span class="tag iphone">iPhone</span>' : '<span class="tag lob">'+esc(r.l)+'</span>';
      html += "<tr><td>"+esc(r.s)+"</td><td class='num'>"+esc(r.c)+"</td><td>"+esc(r.g)+"</td><td>"+esc(r.m)+
              "</td><td class='desc'>"+esc(r.d)+"</td><td>"+tg+"</td><td class='num "+cls+"'>"+fmt(r.a)+
              "</td><td class='num'>"+fmt(r.t)+"</td></tr>";
    }
    if(rs.length>n){
      html += "<tr><td colspan='8' class='num' style='color:#7b8ea8'>仅显示前 "+n+" 行（共 "+fmt(rs.length)+" 行），请用上方条件再筛</td></tr>";
    }
    tb.innerHTML = html;
  }

  function rebuild(id, key, pool){
    var el=document.getElementById(id), cur=el.value;
    var arr = uniq(pool.map(function(r){return r[key];}).filter(function(v){return v;}))
              .sort(function(a,b){return a.localeCompare(b,"zh");});
    el.innerHTML = "<option value=''>"+(id==="f-series"?"全部系列":"全部规格")+"</option>";
    arr.forEach(function(v){
      var o=document.createElement("option"); o.value=v; o.textContent=v; if(v===cur) o.selected=true; el.appendChild(o);
    });
    if(arr.indexOf(cur)<0) el.value="";
  }

  ["f-store","f-cat","f-lob"].forEach(function(id){
    document.getElementById(id).addEventListener("change", function(){ apply(true); });
  });
  ["f-series","f-spec","f-sort"].forEach(function(id){
    document.getElementById(id).addEventListener("change", function(){ apply(false); });
  });
  document.getElementById("f-kw").addEventListener("input", function(){ apply(false); });
  document.getElementById("f-only").addEventListener("change", function(){ apply(false); });
  document.getElementById("btn-reset").addEventListener("click", function(){
    ["f-store","f-cat","f-series","f-lob","f-spec"].forEach(function(id){ document.getElementById(id).value=""; });
    document.getElementById("f-kw").value="";
    document.getElementById("f-only").checked=false;
    apply(true);
  });
  document.getElementById("btn-csv").addEventListener("click", function(){
    var store=document.getElementById("f-store").value, cat=document.getElementById("f-cat").value,
        ser=document.getElementById("f-series").value, lob=document.getElementById("f-lob").value,
        spec=document.getElementById("f-spec").value, kw=document.getElementById("f-kw").value.trim().toLowerCase(),
        only=document.getElementById("f-only").checked;
    var rs = ROWS.filter(function(r){
      if(store && r.s!==store) return false;
      if(cat && r.g!==cat) return false;
      if(ser && r.m!==ser) return false;
      if(lob && r.l!==lob) return false;
      if(spec && r.p!==spec) return false;
      if(only && r.a<=0) return false;
      if(kw){ var hay=(r.d+" "+r.c+" "+r.s+" "+r.m).toLowerCase(); if(hay.indexOf(kw)<0) return false; }
      return true;
    });
    var lines = ["门店,商品编码,大类,系列,规格,物料描述,LOB,可用数量,在途数量"];
    rs.forEach(function(r){
      lines.push([esc(r.s),esc(r.c),esc(r.g),esc(r.m),esc(r.p),esc(r.d),esc(r.l),r.a,r.t].join(","));
    });
    var blob = new Blob(["\ufeff"+lines.join("\n")], {type:"text/csv;charset=utf-8"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download="库存明细_"+Strings()+".csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  });
  function Strings(){
    var d="2026-10-23".replace(/-/g,"");
    return d+"_"+"chuanbei";
  }

  initOpts();
  apply(true);
})();
</script>
</body>
</html>
