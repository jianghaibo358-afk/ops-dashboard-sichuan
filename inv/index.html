<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>库存拆分看板 · 川渝总入口（全部库存）</title>
<style>
  :root{
    --bg:#eef3fa; --card:#fff; --line:#dfe8f5; --line2:#eef3fb;
    --ink:#0b2545; --ink2:#3d5674; --ink3:#7b8ea8;
    --blue:#1668dc; --blue-soft:#e8f1ff;
    --ok:#079455; --warn:#b78103; --sev:#d92d20;
  }
  *{box-sizing:border-box; -webkit-text-size-adjust:100%;}
  body{margin:0; background:var(--bg); color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; font-size:14px;}
  .wrap{max-width:1400px; margin:0 auto; padding:16px 14px 40px;}
  .hd h1{margin:0 0 4px; font-size:21px; font-weight:700;}
  .hd h1 em{font-style:normal; color:var(--blue);}
  .meta{color:var(--ink3); font-size:12px; margin:0 0 12px;}
  .cards{display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:12px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px;}
  .card .lb{color:var(--ink3); font-size:12px;}
  .card .vl{font-size:22px; font-weight:700; line-height:1.25; font-variant-numeric:tabular-nums;}
  .card .sub{font-size:11px; color:var(--ink3);}
  .grpbar{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:10px;}
  .grpbar .lb2{color:var(--ink3); font-size:12px; margin-right:2px;}
  .chip{display:inline-block; padding:5px 12px; border-radius:14px; background:#fff; border:1px solid var(--line);
        color:var(--ink2); font-size:12px; text-decoration:none; cursor:pointer; user-select:none;}
  .chip:hover{border-color:var(--blue); color:var(--blue);}
  .chip.cur{background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600;}
  .chip.lock{cursor:pointer;}
  .bar{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:10px;
       display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
  .bar select,.bar input[type=text]{height:30px; border:1px solid var(--line); border-radius:6px; padding:0 8px;
       font-size:13px; background:#fff; color:var(--ink);}
  .bar input[type=text]{min-width:180px;}
  .bar label.ck{display:inline-flex; align-items:center; gap:4px; font-size:13px; color:var(--ink2); cursor:pointer;}
  .btn{height:30px; padding:0 12px; border-radius:6px; border:1px solid var(--blue); background:var(--blue);
       color:#fff; font-size:13px; cursor:pointer;}
  .btn.gray{background:#fff; color:var(--ink2); border-color:var(--line);}
  .stat{color:var(--ink2); font-size:13px; margin:2px 0 8px;}
  .stat b{color:var(--ink);}
  .tbbox{background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:auto; max-height:70vh;}
  table{border-collapse:collapse; width:100%; font-size:13px;}
  th{position:sticky; top:0; background:#f6f9ff; border-bottom:1px solid var(--line); padding:8px 8px;
     text-align:left; white-space:nowrap; color:var(--ink2); font-weight:600; z-index:2;}
  td{padding:7px 8px; border-bottom:1px solid var(--line2); vertical-align:top;}
  tr:hover td{background:#f8fbff;}
  .num{text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums;}
  .av0{color:var(--ink3);}
  .tag{display:inline-block; padding:1px 6px; border-radius:4px; font-size:11px; border:1px solid transparent;}
  .tag.iphone{background:#e8f1ff; color:var(--blue); border-color:#cfe2ff;}
  .tag.lob{background:#f4f6f9; color:var(--ink2); border-color:var(--line);}
  .desc{color:var(--ink2);}
  .empty{padding:26px; text-align:center; color:var(--ink3);}
  .sec-t{font-size:13px; color:var(--ink2); font-weight:600; margin:18px 0 8px;}
  .mods{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .mod{display:block; text-decoration:none; color:inherit; background:var(--card); border:1px solid var(--line);
       border-radius:10px; padding:11px 13px;}
  .mod:hover{border-color:var(--blue);}
  .mod .nm{font-size:14px; font-weight:700;}
  .mod .nt{font-size:11px; color:var(--ink3); margin:2px 0 7px;}
  .mod .kv{display:flex; gap:12px; flex-wrap:wrap; font-size:11px; color:var(--ink2);}
  .mod .kv b{font-size:14px; color:var(--ink); display:block; font-variant-numeric:tabular-nums;}
  .mod .hl{color:var(--blue);}
  .lk{font-size:11px; color:var(--warn);}
  .foot{margin-top:18px; color:var(--ink3); font-size:12px; line-height:1.7;}
  #gate{position:fixed; inset:0; z-index:99; display:flex; align-items:center; justify-content:center;
        background:linear-gradient(160deg,#eef3fa,#dfe8f5);}
  .gate-card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:26px 28px; width:300px; text-align:center;}
  .gate-card h2{margin:0 0 6px; font-size:17px;}
  .gate-card p{margin:0 0 14px; color:var(--ink3); font-size:12px;}
  .gate-card input{width:100%; height:36px; border:1px solid var(--line); border-radius:8px; padding:0 10px; font-size:14px; margin-bottom:10px;}
  .gate-card button{width:100%; height:36px; border:0; border-radius:8px; background:var(--blue); color:#fff; font-size:14px; cursor:pointer;}
  .gate-err{color:var(--sev); font-size:12px; margin-top:8px; height:16px;}
  @media (max-width:900px){
    .cards{grid-template-columns:repeat(2,1fr);} .mods{grid-template-columns:repeat(1,1fr);}
    .bar select,.bar input[type=text]{width:100%;} th,td{font-size:12px;}
  }
</style>
</head>
<body>
<div id="gate">
  <div class="gate-card">
    <h2>库存拆分看板 · 川渝</h2>
    <p>请输入访问密码</p>
    <input type="password" id="pw" placeholder="密码" autocomplete="off">
    <button id="gate-btn">进入</button>
    <div class="gate-err" id="gate-err"></div>
  </div>
</div>

<div class="wrap">
  <div class="hd">
    <h1>苹果零售 · <em>库存拆分看板</em>（四川 · 全部库存）</h1>
    <div class="meta">库存日期 2026-10-24 ｜ 范围：54 家川渝门店全品类 ｜ 生成于 2026-10-24 13:42</div>
  </div>

  <div class="grpbar" id="grpbar">
    <span class="lb2">快速切换：</span>
  </div>

  <div class="cards" id="cards"></div>

  <div class="bar">
    <select id="f-store"><option value="">全部门店</option></select>
    <select id="f-cat"><option value="">全部大类</option></select>
    <select id="f-series"><option value="">全部系列</option></select>
    <select id="f-lob"><option value="">全部 LOB</option></select>
    <select id="f-spec"><option value="">全部规格</option></select>
    <input type="text" id="f-kw" placeholder="搜索：型号 / 编码 / 物料描述 / 门店">
    <label class="ck"><input type="checkbox" id="f-only"> 仅看有货(可用&gt;0)</label>
    <select id="f-sort">
      <option value="a_desc">按可用↓</option>
      <option value="a_asc">按可用↑</option>
      <option value="s_asc">按门店</option>
      <option value="d_asc">按物料描述</option>
    </select>
    <button class="btn" id="btn-csv">导出 CSV</button>
    <button class="btn gray" id="btn-reset">重置</button>
  </div>

  <div class="stat" id="stat"></div>
  <div class="tbbox">
    <table>
      <thead><tr>
        <th>门店</th><th>商品编码</th><th>大类</th><th>系列</th><th>物料描述</th><th>LOB</th>
        <th class="num">可用</th><th class="num">在途</th>
      </tr></thead>
      <tbody id="tb"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none">没有符合条件的数据</div>
  </div>

  <div class="sec-t">各模块独立视图（发给办事处／重点客户的隔离页，需各自密码）</div>
  <div class="mods" id="mods"></div>

  <div class="foot">
    数据源：DDC 实时库存查询 → 按 54 家川渝门店筛选 → 物料描述取自「8.12四川送达方编码」物料描述表；<br>
    描述匹配不上的商品已整行剔除（主要为 Beats / 第三方配件）。本页为全量视图，上方条件可任意组合筛选并导出 CSV。
  </div>
</div>

    ["f-store","f-cat","f-series","f-lob","f-spec"].forEach(function(id){ document.getElementById(id).value=""; });
    document.getElementById("f-kw").value="";
    document.getElementById("f-only").checked=false;
    initOpts();
    apply(false);
  });
  document.getElementById("btn-csv").addEventListener("click", function(){
    var rs = filterRows(curFilter(false));
    var lines = ["门店,商品编码,大类,系列,规格,物料描述,LOB,可用数量,在途数量"];
    rs.forEach(function(r){
      lines.push([esc(r.s),esc(r.c),esc(r.g),esc(r.m),esc(r.p),esc(r.d),esc(r.l),r.a,r.t].join(","));
    });
    var blob = new Blob(["﻿"+lines.join("\n")], {type:"text/csv;charset=utf-8"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download="库存明细_全部20261024.csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  });

  initOpts();
  apply(false);
})();
</script>
</body>
