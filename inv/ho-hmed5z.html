<style>

  .hd h1{margin:0 0 4px; font-size:20px; font-weight:700;}
  .hd h1 em{font-style:normal; color:var(--blue);}
  .meta{color:var(--ink3); font-size:12px; margin-bottom:12px;}
  .nav{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 14px;}
  .chip{display:inline-block; padding:5px 11px; border-radius:14px; background:#fff; border:1px solid var(--line);
        color:var(--ink2); font-size:12px; text-decoration:none;}
  .chip:hover{border-color:var(--blue); color:var(--blue);}
  .chip.cur{background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600;}
  .cards{display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:14px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px;}
  .card .lb{color:var(--ink3); font-size:12px;}
  .card .vl{font-size:22px; font-weight:700; line-height:1.25;}
  .card .sub{font-size:11px; color:var(--ink3);}
  .bar{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:10px;
       display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
  .bar select,.bar input[type=text]{height:30px; border:1px solid var(--line); border-radius:6px; padding:0 8px;
       font-size:13px; background:#fff; color:var(--ink);}
  .bar input[type=text]{min-width:180px;}
  .bar label.ck{display:inline-flex; align-items:center; gap:4px; font-size:13px; color:var(--ink2); cursor:pointer;}
  .btn{height:30px; padding:0 12px; border-radius:6px; border:1px solid var(--blue); background:var(--blue);
       color:#fff; font-size:13px; cursor:pointer;}
  .btn.gray{background:#fff; color:var(--ink2); border-color:var(--line);}
  .stat{color:var(--ink2); font-size:13px; margin:2px 0 8px;}
  .stat b{color:var(--ink);}
  .tbbox{background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:auto; max-height:72vh;}
  table{border-collapse:collapse; width:100%; font-size:13px;}
  th{position:sticky; top:0; background:#f6f9ff; border-bottom:1px solid var(--line); padding:8px 8px;
     text-align:left; white-space:nowrap; color:var(--ink2); font-weight:600; z-index:2;}
  td{padding:7px 8px; border-bottom:1px solid var(--line2); vertical-align:top;}
  tr:hover td{background:#f8fbff;}
  .num{text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums;}
  .av0{color:var(--ink3);}
  .tag{display:inline-block; padding:1px 6px; border-radius:4px; font-size:11px; border:1px solid transparent;}
  .tag.iphone{background:#e8f1ff; color:var(--blue); border-color:#cfe2ff;}
  .tag.lob{background:#f4f6f9; color:var(--ink2); border-color:var(--line);}
  .desc{color:var(--ink2);}
  .empty{padding:26px; text-align:center; color:var(--ink3);}
  /* 密码门 */
  #gate{position:fixed; inset:0; z-index:99; display:flex; align-items:center; justify-content:center;
        background:linear-gradient(160deg,#eef3fa,#dfe8f5);}
  .gate-card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:26px 28px; width:300px; text-align:center;}
  .gate-card h2{margin:0 0 6px; font-size:17px;}
  .gate-card p{margin:0 0 14px; color:var(--ink3); font-size:12px;}
  .gate-card input{width:100%; height:36px; border:1px solid var(--line); border-radius:8px; padding:0 10px; font-size:14px; margin-bottom:10px;}
  .gate-card button{width:100%; height:36px; border:0; border-radius:8px; background:var(--blue); color:#fff; font-size:14px; cursor:pointer;}
  .gate-err{color:var(--sev); font-size:12px; margin-top:8px; height:16px;}
  @media (max-width:900px){
    .cards{grid-template-columns:repeat(2,1fr);}
    .bar select,.bar input[type=text]{width:100%;}
    th,td{font-size:12px;}
  }
</style>
